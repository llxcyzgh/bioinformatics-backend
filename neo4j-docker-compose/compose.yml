services:
  neo4j:
    image: neo4j:5
    container_name: bioflow-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME} -p ${NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j-init:
    image: python:3.14-slim
    container_name: bioflow-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data.json:/data/data.json:ro
      - ./init.py:/init.py:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH}
      DATA_FILE: /data/data.json
    command: >
      sh -c "pip install neo4j && python /init.py"
    restart: "no"
